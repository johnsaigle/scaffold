[profile.dev]
overflow-checks = true
# Line tables are enough for backtraces; full debuginfo for C and async dependencies dominated target/.
debug = "line-tables-only"

[profile.release]
overflow-checks = true
lto = "fat"
opt-level = 3
strip = "debuginfo"
incremental = true

[lints.clippy]
complexity = "warn"
correctness = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"
suspicious = "warn"
allow_attributes_without_reason = "warn"
